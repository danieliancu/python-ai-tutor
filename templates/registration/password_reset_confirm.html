{% extends "base.html" %}
{% block title %}Choose a new password | Cursuri Python{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>Choose a new password</h1>
  {% if validlink %}
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Change password</button>
    </form>
  {% else %}
    <p class="error">This password reset link is invalid or has expired.</p>
  {% endif %}
</section>
{% endblock %}
