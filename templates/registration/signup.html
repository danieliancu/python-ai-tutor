{% extends "base.html" %}
{% block title %}Create account | Cursuri Python{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>Create your account</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Create account</button>
  </form>
  <p>Already registered? <a href="{% url 'accounts:login' %}">Log in</a>.</p>
</section>
{% endblock %}
