{% load static %}<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="{% block meta_description %}{{ product_name }}: learn step by step with a personal AI tutor.{% endblock %}">
  <meta name="theme-color" content="#f4f5f2">
  <title>{% block title %}{{ product_name }}{% endblock %}</title>
  <script>document.documentElement.classList.replace("no-js", "js");</script>
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <script src="{% static 'vendor/htmx.min.js' %}" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <a class="skip-link" href="#{% block skip_target %}content{% endblock %}">{% block skip_label %}Skip to content{% endblock %}</a>
  {% block body %}
    <main id="content" tabindex="-1">
      {% block content %}{% endblock %}
    </main>
  {% endblock %}
  {% block footer %}{% endblock %}
  {% block extra_js %}{% endblock %}
</body>
</html>
